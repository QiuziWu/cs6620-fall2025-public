name: Docker Build and Push

on:
  push:
    branches:
      - week02

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Deploy to EC2 via SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy cs6620-app via GitHub Actions" \
            --parameters 'commands=[
              "echo Pulling latest Docker image...",
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "echo Stopping existing container...",
              "docker stop cs6620-app || true",
              "echo Removing old container...",
              "docker rm cs6620-app || true",
              "echo Starting new container...",
              "docker run -d --name cs6620-app --restart unless-stopped -p 80:5000 ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "echo Deployment completed successfully!"
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "Deployment command sent with ID: $COMMAND_ID"
      
      - name: Wait for deployment to complete
        run: |
          echo "Waiting for command to complete..."
          aws ssm wait command-executed \
            --command-id ${{ steps.deploy.outputs.COMMAND_ID }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }}
      
      - name: Verify deployment status
        run: |
          COMMAND_ID=${{ steps.deploy.outputs.COMMAND_ID }}
          
          echo "Checking deployment status..."
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Status' \
            --output text)
          
          echo "Deployment Status: $STATUS"
          
          if [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment completed successfully!"
            
            echo "Command Output:"
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'StandardOutputContent' \
              --output text
          else
            echo "❌ Deployment failed with status: $STATUS"
            
            echo "Error Output:"
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'StandardErrorContent' \
              --output text
            
            exit 1
          fi
      
      - name: Display deployment summary
        if: always()
        run: |
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Command ID: ${{ steps.deploy.outputs.COMMAND_ID }}"
          echo "Instance ID: ${{ secrets.EC2_INSTANCE_ID }}"
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
          echo "=========================================="
          echo "View detailed logs in AWS Console:"
          echo "AWS Systems Manager > Run Command > Command history"
          echo "=========================================="
